         one of those font-family declarations was silently falling back to Oswald/system-ui/monospace the
         whole time. Loading them for real (same Google Fonts request the Draft Screen Mockups.dc canvas
         itself uses) is a pure improvement everywhere `font-display` was already used, not just this
         round's new Draft-screen accents. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
